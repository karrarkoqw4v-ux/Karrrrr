name: Build Hala Chat App APK

on:
  push:
    branches: [ccr-ce495802-xqkwag, main]
    paths: ['chat-app/**', '.github/workflows/chat-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: chat-app
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp chat-app/app/build/outputs/apk/release/app-release.apk Hala.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hala-apk
          path: Hala.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=chat-apk-latest
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "${{ github.sha }}" \
              --title "هلا - تطبيق محادثة (أحدث نسخة)" --notes "نسخة تجريبية"
          fi
          gh release upload "$TAG" Hala.apk --clobber
          gh release edit "$TAG" --notes "نسخة تجريبية من تطبيق هلا (أندرويد 8.0 فما فوق). Commit: ${{ github.sha }}"
