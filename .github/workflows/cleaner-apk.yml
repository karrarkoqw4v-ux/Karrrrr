name: Build Suls APK

on:
  push:
    branches: [ccr-ce495802-xqkwag, main]
    paths: ['cleaner/**', '.github/workflows/cleaner-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cleaner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Suls APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Suls.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Suls-apk
          path: cleaner/Suls.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=suls-apk-latest
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "${{ github.sha }}" --title "سلس - أحدث نسخة" --notes "نسخة تجريبية"
          fi
          gh release upload "$TAG" Suls.apk --clobber
          gh release edit "$TAG" --notes "نسخة تجريبية من تطبيق سلس (منظف الجهاز، أندرويد 8.0 فما فوق). Commit: ${{ github.sha }}"
