name: Build Dablik APK

on:
  push:
    branches: [ccr-ce495802-xqkwag, main]
    paths: ['dablik/**', '.github/workflows/dablik-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dablik
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build template shell APK
        run: gradle :shell:assembleRelease --no-daemon --stacktrace
      - name: Embed shell into the app
        run: cp shell/build/outputs/apk/release/shell-release-unsigned.apk app/src/main/assets/shell.apk
      - name: Build Dablik APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Dablik.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dablik-apk
          path: dablik/Dablik.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=dablik-apk-latest
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "${{ github.sha }}" --title "دبليك - أحدث نسخة" --notes "نسخة تجريبية"
          fi
          gh release upload "$TAG" Dablik.apk --clobber
          gh release edit "$TAG" --notes "نسخة تجريبية من تطبيق دبليك (أندرويد 8.0 فما فوق). Commit: ${{ github.sha }}"
