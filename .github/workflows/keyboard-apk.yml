name: Build Lawha Keyboard APK

on:
  push:
    branches: [ccr-ce495802-xqkwag, main]
    paths: ['keyboard/**', '.github/workflows/keyboard-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keyboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Lawha APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Lawha.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lawha-apk
          path: keyboard/Lawha.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=lawha-apk-latest
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "${{ github.sha }}" --title "لوحتي - أحدث نسخة" --notes "نسخة تجريبية"
          fi
          gh release upload "$TAG" Lawha.apk --clobber
          gh release edit "$TAG" --notes "كيبورد عربي (مائي / آيفون فاتح / آيفون داكن). applicationId ثابت iq.lawha.keyboard وموقّع دائماً بنفس المفتاح، فكل نسخة جديدة تُحدّث فوق القديمة بدون حذف. أندرويد 8.0 فما فوق. Commit: ${{ github.sha }}"
