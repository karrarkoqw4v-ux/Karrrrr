name: Build Student App APK

on:
  push:
    branches: [ccr-ce495802-xqkwag, main]
    paths: ['student-app/**', '.github/workflows/student-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: student-app
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp student-app/app/build/outputs/apk/release/app-release.apk IraqiStudent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IraqiStudent-apk
          path: IraqiStudent.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=student-apk-latest
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "${{ github.sha }}" \
              --title "طالب العراق - APK (أحدث نسخة)" --notes "نسخة تجريبية من تطبيق الطالب"
          fi
          gh release upload "$TAG" IraqiStudent.apk --clobber
          gh release edit "$TAG" --notes "نسخة تجريبية من تطبيق الطالب (أندرويد 8.0 فما فوق). Commit: ${{ github.sha }}"
