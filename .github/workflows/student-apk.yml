name: Build Student App APK

on:
  push:
    branches: [ccr-ce495802-xqkwag, main]
    paths: ['student-app/**', '.github/workflows/student-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: student-app
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp student-app/app/build/outputs/apk/release/app-release.apk IraqiStudent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IraqiStudent-apk
          path: IraqiStudent.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: student-apk-latest
          name: طالب العراق - APK (أحدث نسخة)
          prerelease: true
          files: IraqiStudent.apk
          body: |
            نسخة تجريبية من تطبيق الطالب (أندرويد 8.0 فما فوق).
            Commit: ${{ github.sha }}
