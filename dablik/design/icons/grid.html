<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:CI;src:url(CupertinoIcons.ttf)}
@font-face{font-family:T;font-weight:700;src:url(tajawal_bold.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;background:#0b0b0e;font-family:T}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:28px;padding:40px}
.cell{background:#1c1c1e;border-radius:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;height:220px;gap:14px;border:1px solid #2c2c2e}
.cell i{font-family:CI;font-size:64px;color:#fff;font-style:normal}
.cell b{color:#9a9a9f;font-size:18px}
.cell code{color:#5a5a60;font-size:13px;font-family:monospace}
</style></head><body>
<div class="grid">
  <div class="cell"><i>&#xf89b;</i><b>wifi</b><code>0xf89b</code></div>
  <div class="cell"><i>&#xf116;</i><b>bluetooth</b><code>0xf116</code></div>
  <div class="cell"><i>&#xf4d4;</i><b>airplane</b><code>0xf4d4</code></div>
  <div class="cell"><i>&#xf593;</i><b>bolt (flashlight)</b><code>0xf593</code></div>
  <div class="cell"><i>&#xf868;</i><b>timer</b><code>0xf868</code></div>
  <div class="cell"><i>&#xf3f5;</i><b>camera</b><code>0xf3f5</code></div>
</div>
</body></html>
