<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:T;font-weight:500;src:url(tajawal_medium.ttf)}
@font-face{font-family:T;font-weight:700;src:url(tajawal_bold.ttf)}
@font-face{font-family:T;font-weight:800;src:url(tajawal_extrabold.ttf)}
:root{--cream:#F0EEE6;--ink:#141413;--or:#D97757;--or2:#C6613F;--sand:#E3DACC;--gray:#55534C;--card:#1c1c1e;--blue:#3e91ff;--green:#3ddc84}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:var(--cream);font-family:T}
#s{position:relative;width:1280px;height:720px;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
#grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
.badge{position:absolute;top:56px;right:64px;background:var(--ink);color:var(--cream);font-weight:800;font-size:24px;padding:10px 26px;border-radius:40px;display:flex;align-items:center;gap:10px}
.badge .dot{width:10px;height:10px;border-radius:50%;background:var(--green)}
.logo{position:absolute;left:70px;top:64px;width:92px;height:92px;border-radius:26px;background:linear-gradient(145deg,#E58A6A,#C6613F);display:grid;place-items:center;box-shadow:0 20px 40px -14px #C6613F99}
.logo svg{width:52px;height:52px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.brand{position:absolute;left:176px;top:76px;font-size:40px;font-weight:800;color:var(--ink)}
.brand span{color:var(--or)}
h1{position:absolute;right:64px;top:210px;width:620px;font-size:64px;font-weight:800;color:var(--ink);line-height:1.18;text-align:right}
h1 b{color:var(--or)}
.sub{position:absolute;right:64px;top:476px;width:560px;font-size:28px;font-weight:700;color:var(--gray);text-align:right;line-height:1.5}
.pills{position:absolute;right:64px;bottom:56px;display:flex;gap:14px;direction:ltr}
.pill{background:#14141310;border:2px solid #14141325;border-radius:40px;padding:12px 26px;font-weight:800;font-size:22px;color:var(--ink);font-family:monospace}

/* phone */
#phoneWrap{position:absolute;left:40px;top:120px;width:480px;height:560px}
#phone{position:absolute;width:300px;height:620px;border-radius:46px;background:#0b0b0c;padding:8px;box-shadow:0 60px 100px -30px #14141399,0 0 0 2px #2b2b2d,inset 0 0 0 2px #3a3a3d;transform:rotate(-7deg);left:70px;top:30px}
#screen{width:284px;height:604px;border-radius:40px;overflow:hidden;background:#000;position:relative;color:#f5f5f5;direction:rtl}
.sb{position:absolute;top:0;left:0;right:0;height:30px;display:flex;justify-content:space-between;padding:9px 20px 0;font-size:11px;color:#ddd}
.aur{position:absolute;border-radius:50%;filter:blur(36px)}
.htitle{position:absolute;top:150px;right:26px;font-size:34px;font-weight:800;color:#fff}
.hsub{position:absolute;top:196px;right:26px;font-size:13px;color:#9a9a9f;width:230px}
.tile{position:absolute;top:250px;width:118px;height:140px;background:#1c1c1e;border-radius:24px;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.tile .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.tile .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:14px;font-weight:800;color:#fff}
.glow{position:absolute;inset:-40px;border-radius:60px;background:radial-gradient(closest-side,#D9775755,transparent);z-index:-1}
.check{position:absolute;width:76px;height:76px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 18px 30px -8px #3ddc8477}
.check svg{width:40px;height:40px;stroke:#04210f;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em}
</style></head><body><div id="s">
<div class="glow" style="position:absolute;left:0;top:60px;width:560px;height:560px"></div>
<div class="blob" style="width:520px;height:520px;background:#E9B8A0;right:-140px;top:-120px"></div>
<div class="blob" style="width:460px;height:460px;background:#F2D9B8;left:-160px;bottom:-160px"></div>
<div id="grain"></div>

<div class="badge"><div class="dot"></div>تطبيق حقيقي 100%</div>
<div class="logo"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg></div>
<div class="brand">دبليك<span>.</span></div>

<h1>حوّل <b>موقعك</b> إلى<br>تطبيق أندرويد<br>بثواني!</h1>
<div class="sub">بدون برمجة، بدون حاسوب — من جهازك مباشرة</div>
<div class="pills"><div class="pill">HTML</div><div class="pill">ZIP</div><div class="pill">APK</div></div>

<div id="phoneWrap">
  <div id="phone"><div id="screen">
    <div class="sb"><span>9:41</span><span>5G 100%</span></div>
    <div class="aur" style="width:260px;height:260px;background:#4285F4;right:-70px;top:-50px;opacity:.55"></div>
    <div class="aur" style="width:230px;height:230px;background:#EA4335;left:-70px;top:30px;opacity:.5"></div>
    <div class="aur" style="width:200px;height:200px;background:#FBBC05;right:50px;top:140px;opacity:.4"></div>
    <div class="aur" style="width:230px;height:230px;background:#34A853;left:-30px;top:170px;opacity:.4"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(#0000 10%,#000 56%)"></div>
    <div class="htitle">دبليك</div>
    <div class="hsub">حوّل موقعك إلى تطبيق APK قابل للتثبيت</div>
    <div class="tile" style="right:26px"><div class="ic" style="background:#3e91ff2e;color:#3e91ff"><svg viewBox="0 0 24 24"><path d="M5 16a7 7 0 0 1 14 0z"/><circle cx="9.5" cy="13" r=".6"/><circle cx="14.5" cy="13" r=".6"/></svg></div><b>إنشاء APK</b></div>
    <div class="tile" style="left:26px"><div class="ic" style="background:#3ddc842e;color:#3ddc84"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div><b>ZIP/HTML</b></div>
  </div></div>
  <div class="check" style="left:30px;top:470px"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
</div>
</div></body></html>
