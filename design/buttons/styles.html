<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:T;font-weight:500;src:url(tajawal_medium.ttf)}
@font-face{font-family:T;font-weight:700;src:url(tajawal_bold.ttf)}
@font-face{font-family:T;font-weight:800;src:url(tajawal_extrabold.ttf)}
*{box-sizing:border-box;margin:0;padding:0;font-family:T}
body{background:#0b0b10}
.sheet{width:2200px;padding:60px;background:#0b0b10}
h1{color:#fff;font-size:44px;font-weight:800;margin-bottom:34px}
.row{display:flex;gap:40px;flex-wrap:wrap;margin-bottom:60px}
.cell{width:330px}
.cell .lbl{color:#9aa0b4;font-size:20px;font-weight:700;margin-bottom:14px;text-align:center}
.bg{position:relative;width:330px;height:220px;border-radius:28px;overflow:hidden;background:
  radial-gradient(circle at 30% 20%,#ff8a5c 0%,transparent 45%),
  radial-gradient(circle at 75% 15%,#8a5cff 0%,transparent 50%),
  radial-gradient(circle at 60% 80%,#2fd0c8 0%,transparent 50%),
  linear-gradient(160deg,#1a1033,#0b0a14)}
.bg .photo{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px;opacity:.9}
.bg .photo div{border-radius:10px}
.navbar{position:absolute;left:14px;right:14px;bottom:14px;height:64px;display:flex;align-items:center;justify-content:space-around}
.topbar{position:absolute;left:14px;right:14px;top:14px;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.icon{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8}
.icon.filled{fill:#fff;stroke:none}
.settingsrow{width:330px;height:64px;display:flex;align-items:center;padding:0 18px;gap:14px}
.settingsrow .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.settingsrow span{color:#fff;font-size:17px;font-weight:700;flex:1}
.settingsrow .chev{width:18px;height:18px;stroke:#9aa0b4;fill:none;stroke-width:2}

/* ===== الأنماط الستة ===== */
.s-glassblue{background:linear-gradient(135deg,rgba(59,130,246,.72),rgba(29,78,216,.6));backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(190,220,255,.5);border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 24px -10px #0008}
.s-water{background:linear-gradient(160deg,rgba(14,165,183,.78),rgba(6,110,130,.65));backdrop-filter:blur(12px) saturate(1.2);border:1px solid rgba(180,255,250,.5);border-radius:30px;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 10px 26px -10px #0007}
.s-instagrad{background:linear-gradient(90deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);border-radius:22px;box-shadow:0 10px 24px -10px #0009}
.s-flatdark{background:#15151a;border-top:1px solid #26262e;border-radius:0}
.s-frostwhite{background:rgba(255,255,255,.82);backdrop-filter:blur(14px) saturate(1.1);border:1px solid rgba(255,255,255,.9);border-radius:26px;box-shadow:0 10px 24px -10px #0006}
.s-neumorph{background:#1c1c24;border-radius:30px;box-shadow:8px 8px 18px #0b0b10,-8px -8px 18px #272732}

.navbar.s-frostwhite .icon{stroke:#1a1a2e}
.settingsrow.s-frostwhite span{color:#1a1a2e}
.settingsrow.s-frostwhite .chev{stroke:#6b7280}

/* بطاقة تسجيل الدخول */
.loginwrap{width:620px;height:1000px;border-radius:44px;overflow:hidden;position:relative;background:linear-gradient(160deg,#1a1033,#0b0a14)}
.loginwrap .deco{position:absolute;inset:0}
.loginwrap .content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px}
.card{width:100%;padding:36px 30px;border-radius:32px}
.card h2{color:#fff;font-size:32px;font-weight:800;margin-bottom:8px;text-align:center}
.card p{color:rgba(255,255,255,.7);font-size:16px;margin-bottom:28px;text-align:center}
.field{width:100%;height:58px;border-radius:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);margin-bottom:16px;display:flex;align-items:center;padding:0 20px;color:rgba(255,255,255,.75);font-size:16px}
.btn{width:100%;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:800;margin-top:10px}
.btn.glassblue{background:linear-gradient(135deg,#3b82f6,#60a5fa);box-shadow:0 14px 28px -10px #3b82f688}
.btn.water{background:linear-gradient(135deg,#0ea5b7,#22d3ee);box-shadow:0 14px 28px -10px #06b6d488}
</style></head><body>

<div class="sheet" id="root">

<h1>1 - الشريط السفلي (Bottom Nav)</h1>
<div class="row" id="navs">
</div>

<h1>2 - الشريط العلوي (Top Bar)</h1>
<div class="row" id="tops">
</div>

<h1>3 - زر داخل الإعدادات (Settings Row)</h1>
<div class="row" id="settingsrows">
</div>

<h1>4 - إعادة تصميم تسجيل الدخول</h1>
<div class="row" id="logins">
</div>

</div>

<script>
const styles = [
  {cls:'s-glassblue', name:'زجاجي أزرق'},
  {cls:'s-water', name:'مائي'},
  {cls:'s-instagrad', name:'تدرّج إنستا'},
  {cls:'s-flatdark', name:'مسطح داكن'},
  {cls:'s-frostwhite', name:'زجاج أبيض'},
  {cls:'s-neumorph', name:'نيومورفيزم'},
];
const ICONS = {
  home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  add:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',
  reels:'<rect x="2" y="4" width="20" height="16" rx="4"/><path d="M8 4l3 5M14 4l3 5"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>',
};
function icon(name, filled){ return `<svg class="icon${filled?' filled':''}" viewBox="0 0 24 24">${ICONS[name]}</svg>`; }

const navsEl = document.getElementById('navs');
styles.forEach(st => {
  const cell = document.createElement('div'); cell.className='cell';
  cell.innerHTML = `<div class="lbl">${st.name}</div>
    <div class="bg">
      <div class="photo">${Array.from({length:12}).map((_,i)=>`<div style="background:hsl(${i*37%360} 70% 55%)"></div>`).join('')}</div>
      <div class="navbar ${st.cls}">
        ${['home','search','add','reels','profile'].map(n=>icon(n, n==='home')).join('')}
      </div>
    </div>`;
  navsEl.appendChild(cell);
});

const topsEl = document.getElementById('tops');
styles.forEach(st => {
  const cell = document.createElement('div'); cell.className='cell';
  cell.innerHTML = `<div class="lbl">${st.name}</div>
    <div class="bg">
      <div class="photo">${Array.from({length:12}).map((_,i)=>`<div style="background:hsl(${(i*53+40)%360} 65% 50%)"></div>`).join('')}</div>
      <div class="topbar ${st.cls}">
        <svg class="icon" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        <span style="color:${st.cls==='s-frostwhite'?'#1a1a2e':'#fff'};font-weight:800;font-size:18px">تواصلكم</span>
        <svg class="icon" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2"/><circle cx="18" cy="12" r="2"/><circle cx="18" cy="19" r="2"/></svg>
      </div>
    </div>`;
  topsEl.appendChild(cell);
});

const srEl = document.getElementById('settingsrows');
styles.forEach(st => {
  const cell = document.createElement('div'); cell.className='cell';
  cell.innerHTML = `<div class="lbl">${st.name}</div>
    <div class="settingsrow ${st.cls}">
      <div class="ic" style="background:rgba(255,255,255,.18)"><svg class="icon" viewBox="0 0 24 24" style="stroke:${st.cls==='s-frostwhite'?'#1a1a2e':'#fff'}"><path d="M12 2l2.4 5.6L20 9l-4.6 3.9L16.8 19 12 15.8 7.2 19l1.4-6.1L4 9l5.6-1.4z"/></svg></div>
      <span>الخصوصية</span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
    </div>`;
  srEl.appendChild(cell);
});

const loginsEl = document.getElementById('logins');
const logins = [
  {cls:'glassblue', name:'زجاجي أزرق', cardBg:'linear-gradient(135deg,rgba(59,130,246,.55),rgba(29,78,216,.42))', border:'rgba(190,220,255,.45)', blob1:'#3b82f6', blob2:'#60a5fa'},
  {cls:'water', name:'مائي', cardBg:'linear-gradient(160deg,rgba(14,165,183,.58),rgba(6,110,130,.44))', border:'rgba(180,255,250,.4)', blob1:'#0ea5b7', blob2:'#22d3ee'},
];
logins.forEach(lg => {
  const cell = document.createElement('div'); cell.className='cell'; cell.style.width='660px';
  cell.innerHTML = `<div class="lbl">${lg.name}</div>
    <div class="loginwrap">
      <div class="deco" style="background:
        radial-gradient(circle at 20% 15%, ${lg.blob1}aa 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, ${lg.blob2}aa 0%, transparent 50%)"></div>
      <div class="content">
        <svg width="70" height="70" viewBox="0 0 24 24" style="margin-bottom:22px"><circle cx="12" cy="12" r="11" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M8 13c1 2 2 3 4 3s3-1 4-3" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="9" cy="9" r="1" fill="#fff"/><circle cx="15" cy="9" r="1" fill="#fff"/></svg>
        <div class="card" style="background:${lg.cardBg};backdrop-filter:blur(22px) saturate(1.5);border:1px solid ${lg.border};box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 20px 50px -20px #000a">
          <h2>هلا بيك مجدداً</h2>
          <p>سجّل دخولك لتكمل دردشتك</p>
          <div class="field">اسم المستخدم أو البريد</div>
          <div class="field">كلمة المرور</div>
          <div class="btn ${lg.cls}">دخول</div>
        </div>
        <div style="color:rgba(255,255,255,.65);margin-top:22px;font-size:15px">ما عندك حساب؟ <b style="color:#fff">سجّل الحين</b></div>
      </div>
    </div>`;
  loginsEl.appendChild(cell);
});
</script>
</body></html>
