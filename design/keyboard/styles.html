<!doctype html><html lang="ar" dir="ltr"><head><meta charset="utf-8">
<style>
@font-face{font-family:T;font-weight:500;src:url(tajawal_medium.ttf)}
@font-face{font-family:T;font-weight:700;src:url(tajawal_bold.ttf)}
*{box-sizing:border-box;margin:0;padding:0;font-family:T,-apple-system,sans-serif}
body{background:#0b0b10}
.sheet{display:flex;gap:70px;padding:60px;background:#0b0b10}
.phone{width:620px}
.lbl{color:#fff;font-size:30px;font-weight:700;text-align:center;margin-bottom:20px}
.screen{position:relative;width:620px;height:1340px;border-radius:46px;overflow:hidden;background:#1c1c1e}
.statusbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;color:#fff;font-size:22px;font-weight:700}
.appbar{height:70px;display:flex;align-items:center;padding:0 20px;color:#fff;font-size:26px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.08)}
.chatarea{position:absolute;left:0;right:0;top:130px;bottom:0;padding:20px}
.bubble{max-width:70%;padding:16px 20px;border-radius:22px;font-size:24px;margin-bottom:14px}
.bubble.them{background:#2c2c2e;color:#fff;border-bottom-left-radius:6px}
.bubble.me{background:#0a84ff;color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.typing{position:absolute;left:20px;right:20px;top:460px;height:70px;background:#2c2c2e;border-radius:20px;display:flex;align-items:center;padding:0 22px;color:rgba(255,255,255,.4);font-size:24px}

/* ===== لوحة المفاتيح ===== */
.kb{position:absolute;left:0;right:0;bottom:0;padding:10px 6px 18px}
.row{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.key{height:66px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:1}
.key.wide{flex:1.5}
.key.space{flex:5}
.key.small{font-size:20px}

/* Water keyboard — مائي 100%: كل عنصر بتدرجات مائية فقط، بدون أي لون غريب */
.kb.water{
  background:
    radial-gradient(circle at 15% 10%, rgba(120,230,255,.18) 0%, transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(14,165,183,.25) 0%, transparent 50%),
    linear-gradient(160deg, rgba(5,40,48,.55), rgba(2,14,18,.7));
  backdrop-filter:blur(14px) saturate(1.3);
}
.kb.water .key{background:linear-gradient(160deg,rgba(34,211,238,.4),rgba(6,110,130,.35));border:1px solid rgba(180,255,250,.4);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 10px -4px rgba(0,0,0,.4)}
.kb.water .key.wide{background:linear-gradient(160deg,rgba(14,165,183,.5),rgba(3,70,85,.4));border:1px solid rgba(180,255,250,.3)}
.kb.water .key.space{background:linear-gradient(160deg,rgba(34,211,238,.3),rgba(14,165,183,.25));border:1px solid rgba(180,255,250,.3)}

/* iOS light — قيم حقيقية موثّقة (نظام الألوان الديناميكي لأبل + مرجع فتح مصدر لثيمات كيبورد iOS) */
.kb.ioslight{background:#dfe1e6}
.kb.ioslight .key{background:#fff;color:#000;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.kb.ioslight .key.wide{background:#adb1ba;color:#000;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.kb.ioslight .key.space{background:#fff;color:#000;box-shadow:0 1px 0 rgba(0,0,0,.25)}

/* iOS dark */
.kb.iosdark{background:#17181a}
.kb.iosdark .key{background:#3c3d3f;color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.4)}
.kb.iosdark .key.wide{background:#232426;color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.3)}
.kb.iosdark .key.space{background:#3c3d3f;color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.4)}

.predict{height:48px;display:flex;align-items:center;justify-content:space-around;padding:0 20px;font-size:22px}
.kb.water .predict{color:rgba(255,255,255,.65)}
.kb.ioslight .predict{color:#000}
.kb.iosdark .predict{color:#fff}

/* زر الإدخال Return: أزرق النظام الحقيقي #007AFF، نفس اللون بالفاتح والداكن */
.kb.ioslight .key.enter, .kb.iosdark .key.enter{background:#007aff;color:#fff}
.kb.water .key.enter{background:linear-gradient(160deg,rgba(34,211,238,.75),rgba(14,165,183,.6));border:1px solid rgba(220,255,252,.55);color:#fff}
</style></head><body>
<div class="sheet" id="root">

<div class="phone" id="p1">
  <div class="lbl">١ - مائي شفاف</div>
  <div class="screen">
    <div class="statusbar">9:41 <span>🔋100%</span></div>
    <div class="appbar">محادثة</div>
    <div class="chatarea">
      <div class="bubble them">هلا شلونك اليوم؟</div>
      <div class="bubble me">تمام والحمدلله، وانت؟</div>
    </div>
    <div class="typing">اكتب رسالة...</div>
    <div class="kb water" id="kb1"></div>
  </div>
</div>

<div class="phone" id="p2">
  <div class="lbl">٢ - نسخة iPhone (فاتح)</div>
  <div class="screen" style="background:#fff">
    <div class="statusbar" style="color:#000">9:41 <span>🔋100%</span></div>
    <div class="appbar" style="color:#000;border-bottom:1px solid #e5e5ea">محادثة</div>
    <div class="chatarea">
      <div class="bubble them" style="background:#e9e9eb;color:#000">هلا شلونك اليوم؟</div>
      <div class="bubble me">تمام والحمدلله، وانت؟</div>
    </div>
    <div class="typing" style="background:#f2f2f7;color:#8e8e93">اكتب رسالة...</div>
    <div class="kb ioslight" id="kb2"></div>
  </div>
</div>

<div class="phone" id="p3">
  <div class="lbl">٣ - نسخة iPhone (داكن)</div>
  <div class="screen">
    <div class="statusbar">9:41 <span>🔋100%</span></div>
    <div class="appbar">محادثة</div>
    <div class="chatarea">
      <div class="bubble them">هلا شلونك اليوم؟</div>
      <div class="bubble me">تمام والحمدلله، وانت؟</div>
    </div>
    <div class="typing">اكتب رسالة...</div>
    <div class="kb iosdark" id="kb3"></div>
  </div>
</div>

</div>
<script>
const rows = [
  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l'],
  ['⇧','z','x','c','v','b','n','m','⌫'],
];
function buildKB(id, predictWords) {
  const kb = document.getElementById(id);
  const p = document.createElement('div'); p.className='predict';
  predictWords.forEach(w=>{ const s=document.createElement('span'); s.textContent=w; p.appendChild(s); });
  kb.appendChild(p);
  rows.forEach((row,ri)=>{
    const r = document.createElement('div'); r.className='row';
    if(ri===2){ r.style.paddingLeft='0px'; }
    row.forEach(k=>{
      const d = document.createElement('div');
      d.className = 'key' + ((k==='⇧'||k==='⌫')?' wide':'') + ((k==='⇧'||k==='⌫')?' small':'');
      d.textContent = k;
      r.appendChild(d);
    });
    kb.appendChild(r);
  });
  const last = document.createElement('div'); last.className='row';
  ['123','🌐'].forEach(k=>{ const d=document.createElement('div'); d.className='key wide small'; d.textContent=k; last.appendChild(d); });
  const space = document.createElement('div'); space.className='key space small'; space.textContent='space'; last.appendChild(space);
  const ret = document.createElement('div'); ret.className='key wide small enter'; ret.textContent='return'; last.appendChild(ret);
  kb.appendChild(last);
}
buildKB('kb1', ['تمام','يلا','شلونك']);
buildKB('kb2', ['تمام','يلا','شلونك']);
buildKB('kb3', ['تمام','يلا','شلونك']);
</script>
</body></html>
